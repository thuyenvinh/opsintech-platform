[project]
name = "deerflow-harness"
version = "0.1.0"
description = "DeerFlow agent harness framework"
requires-python = ">=3.12"
dependencies = [
    "agent-sandbox>=0.0.30",
    "dotenv>=0.9.9",
    "httpx>=0.28.0",
    "kubernetes>=37.0.3",
    "langchain>=1.2.3",
    "langchain-anthropic>=1.3.4",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.1.7",
    "langgraph>=1.2.24",
    "langgraph-api>=0.17.5",
    "langgraph-cli>=0.4.14",
    "langgraph-runtime-inmem>=0.37.5",
    "markdownify>=1.2.2",
    "markitdown[all,xlsx]>=0.1.5",
    "pydantic>=2.12.5",
    "pypdf>=5.0.0",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "tavily-python>=0.8.5",
    "firecrawl-py>=4.57.0",
    "tiktoken>=0.14.0",
    "ddgs>=9.10.0",
    "duckdb>=2.0.0",
    "langchain-google-genai>=4.2.1",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langgraph-sdk>=0.4.14",
    "sqlmodel>=0.0.50",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow"]
