[project]
name = "opsintech"
version = "0.1.0"
description = "LangGraph-based AI agent system with sandbox execution capabilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deerflow-harness",
    "fastapi>=0.165.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
    "lark-oapi>=1.4.0",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=22.8",
    "langgraph-sdk>=0.4.14",
    "langgraph-checkpoint-postgres>=3.2.1",
    "markdown-to-mrkdwn>=0.3.1",
    "alembic>=1.18.4",
    "sqlmodel>=0.0.50",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "psycopg[binary]>=3.2",
    "greenlet>=3.3.2",
    "bcrypt>=5.0.0",
    "langchain-ollama>=1.1.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.14.11"]

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
deerflow-harness = { workspace = true }
